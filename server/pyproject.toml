[project]
name = "gitrics-server"
version = "0.1.0"
description = "A server for Gitrics, a tool for analyzing Git repositories."
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.3",
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.50",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=1.18.1",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: unit tests (without external I/O)",
]