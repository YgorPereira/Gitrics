[project]
name = "gitrics-server"
version = "0.1.0"
description = "A server for Gitrics, a tool for analyzing Git repositories."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "black>=26.5.1",
    "fastapi>=0.136.3",
    "loguru>=0.7.3",
    "mypy>=2.1.0",
    "pydantic-settings>=2.14.2",
    "pytest>=9.0.3",
    "sqlalchemy[asyncio]>=2.0.50",
    "uvicorn>=0.49.0",
]
