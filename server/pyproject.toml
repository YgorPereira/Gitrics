[project]
name = "gitrics-server"
version = "0.1.0"
description = "A server for Gitrics, a tool for analyzing Git repositories."
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "psycopg>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=1.18.1",
    "psycopg[binary]>=3.3.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-env>=1.7.0",
    "pytest-postgresql>=8.1.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: unit tests (without external I/O)",
    "integration: integration tests (without external dependencies)",
]
asyncio_mode = "auto"
[tool.pytest_env]
testpaths = ["tests"]
env_files = [".env.test"]
[tool.mypy]
cache_dir = ".mypy_cache"
warn_unused_ignores = false
ignore_missing_imports = true
